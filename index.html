<!DOCTYPE html>
<html>
<head>
    <title>Ravenkeeper</title>
</head>
<body>
    <select id="script-select">
        <option value="">Select a script</option>
    </select>
    <select id="num-players-select">
        <option value=5 selected>5</option>
        <option value=6>6</option>
    </select>

    <table id="role-count-display">
        <tr>
            <th scope="row">Players</th>
            <td class="num-player-5">5</td>
            <td>6</td>
        </tr>
        <tr>
            <th scope="row">Townsfolk</th>
            <td class="num-player-5">3</td>
            <td>3</td>
        </tr>
        <tr>
            <th scope="row">Outsiders</th>
            <td class="num-player-5">0</td>
            <td>1</td>
        </tr>
        <tr>
            <th scope="row">Minions</th>
            <td class="num-player-5">1</td>
            <td>1</td>
        </tr>
        <tr>
            <th scope="row">Demons</th>
            <td class="num-player-5">1</td>
            <td>1</td>
        </tr>
    </table>

    <ol id="player-list">
        <li>Placeholder</li>
    </ol>

    <details>
        <summary>Role Descriptions</summary>
        <ul id="role-descriptions-details"></ul>
    </details>

    <details>
        <summary>First Night Order</summary>
        <ul id="first-order-details"></ul>
    </details>

    <details>
        <summary>Other Night Order</summary>
        <ul id="other-order-details"></ul>
    </details>
    
    <script src="data/scripts/trouble_brewing.js"></script>
    <script src="data/scripts/bad_moon_rising.js"></script>
    <script src="data/scripts/sects_and_violets.js"></script>
    <script src="data/scripts/fmt_last_game.js"></script>
    <script src="data/scripts/fmt_hide_and_seek.js"></script>
    <script src="data/scripts/all.js"></script>
    <script src="main.js"></script>
</body>
</html>
